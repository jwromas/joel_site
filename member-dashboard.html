<!DOCTYPE html>
<html>
<head>
  <title>Member Dashboard | Still In The Fight</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: #0f0f0f;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    .box {
      max-width: 500px;
      margin: auto;
      background: #1c1c1c;
      padding: 30px;
      border-radius: 8px;
    }
    input {
      padding: 10px;
      width: 80%;
      margin: 10px 0;
    }
    button {
      padding: 10px 20px;
      background: #c0392b;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Member Access</h1>
  <p>Enter your access code</p>

  <input type="password" id="password" placeholder="Enter password">
  <br>
  <button onclick="checkPassword()">Enter</button>

  <p id="error" style="color:red;"></p>
</div>

<script>
  function checkPassword() {
    const password = document.getElementById("password").value;
    const correctPassword = "TACTICAL40"; // change this anytime
    if (password === correctPassword) {
     window.location.href = "./strength-after-40.html";
    } else {
      document.getElementById("error").innerText = "Incorrect password.";
    }
  }
</script>

</body>
</html>
