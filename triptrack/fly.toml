# fly.toml app configuration file generated for triptrack-drifting-wave-3593 on 2026-07-26T13:57:42-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'triptrack-drifting-wave-3593'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "data"
  destination = "/data"
