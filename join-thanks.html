<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're In!</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}
.card {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px;
    max-width: 400px;
    width: 100%;
    text-align: center;
}
.check { font-size: 48px; margin-bottom: 16px; }
h1 {
    font-size: 24px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
p { color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
a {
    display: inline-block;
    padding: 12px 24px;
    background: #3b82f6;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
}
a:hover { background: #2563eb; }
</style>
</head>
<body>
<div class="card">
    <div class="check">✓</div>
    <h1>You're In!</h1>
    <p>Check your email for exclusive travel deals, VR experience previews, and flight alerts.</p>
    <a href="https://jwromas.github.io/joel_site/">Back to Home</a>
</div>
</body>
</html>
