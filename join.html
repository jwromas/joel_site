<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel Journeys - Get Exclusive Travel Deals</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}
.card {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 40px;
    max-width: 400px;
    width: 100%;
    text-align: center;
}
.badge {
    display: inline-block;
    background: #3b82f6;
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 12px;
}
h1 {
    font-size: 24px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
p { color: #94a3b8; margin-bottom: 24px; font-size: 14px; }
input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #475569;
    border-radius: 8px;
    background: #1e293b;
    color: #fff;
    font-size: 14px;
    margin-bottom: 12px;
    box-sizing: border-box;
}
input:focus, select:focus { outline: none; border-color: #60a5fa; }
select { cursor: pointer; }
select option { background: #1e293b; color: #fff; }
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}
button:hover { opacity: 0.9; }
.success { display: none; color: #22c55e; font-size: 16px; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
    <div class="badge">VIP ACCESS</div>
    <h1>Joel Journeys</h1>
    <p>Get exclusive travel deals, VR experiences, and flight alerts</p>
    
    <form id="leadForm">
        <input type="text" id="name" placeholder="Your name" required>
        <input type="email" id="email" placeholder="Email address" required>
        <input type="tel" id="phone" placeholder="Phone (optional)">
        <select id="interest" required>
            <option value="" disabled selected>What interests you?</option>
            <option value="Bahamas Beachfront">Bahamas Beachfront</option>
            <option value="Dubai Skyline">Dubai Skyline</option>
            <option value="St. Croix Beach Walk">St. Croix Beach Walk</option>
            <option value="Santino Cult">Santino Cult</option>
            <option value="Cancun Paradise">Cancun Paradise</option>
            <option value="eSIM Data Plans">eSIM Data Plans</option>
            <option value="Flight Deals">Flight Deals</option>
            <option value="All of the above">All of the above</option>
        </select>
        <button type="submit">Get My Deals</button>
    </form>
    <div class="success" id="success">You're in! Check your email for exclusive offers.</div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBgyE5BHi4XlYMoLFeQ5OcW92e5TWNwt8jG1cAlq4Nwdk1J_6Gz95lhRZo1eH2HDNdAA/exec';

document.getElementById('leadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        interest: document.getElementById('interest').value
    };
    
    fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(data),
        mode: 'no-cors'
    }).then(function() {
        document.getElementById('leadForm').style.display = 'none';
        document.getElementById('success').style.display = 'block';
    });
});
</script>
</body>
</html>
