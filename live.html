<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joel Journeys — Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .stream-container {
            width: 100%;
            max-width: 1200px;
            position: relative;
        }
        .video-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,150,255,0.15);
        }
        .video-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .brand {
            text-align: center;
            padding: 20px 0 10px;
        }
        .brand h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
        }
        .brand .sub {
            color: #8b949e;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .cta {
            text-align: center;
            padding: 20px 0;
        }
        .cta a {
            display: inline-block;
            background: linear-gradient(135deg, #0096ff, #0070cc);
            color: #fff;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta a:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 30px rgba(0,150,255,0.4);
        }
        .footer {
            color: #484f58;
            font-size: 0.75rem;
            padding: 10px 0 20px;
        }
    </style>
</head>
<body>

<div class="stream-container">
    <div class="brand">
        <h1>JOEL JOURNEYS</h1>
        <div class="sub">Live travel deals & streaming</div>
    </div>

    <div class="video-wrap">
        <iframe 
            src="https://www.youtube.com/embed/GinUungufd0?autoplay=1&mute=1" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>

    <div class="cta">
        <a href="https://joeljourneys.com" target="_blank">Book Your Trip</a>
    </div>

    <div class="footer">&copy; 2026 Joel Journeys</div>
</div>

</body>
</html>
